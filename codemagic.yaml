
workflows:
  ios-simulator:
    name: Native Swift iOS Simulator Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build for iOS Simulator
        script: |
          xcodebuild \
            -project SwiftDemo.xcodeproj \
            -scheme SwiftDemo \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/SwiftDemo.app
